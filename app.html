<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>우리집 재무 대시보드</title>
<link rel="manifest" href="./manifest.webmanifest?v=20260911-1105">
<link rel="icon" href="./app-icon.svg?v=20260907-0915" type="image/svg+xml">
<link rel="apple-touch-icon" href="./app-icon.svg?v=20260907-0915">
<style>
html,body{margin:0;min-height:100%;background:#06101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;background:radial-gradient(circle at 50% 10%,#162945 0,#06101d 45%,#04080e 100%)}
.card{width:min(420px,100%);text-align:center;padding:34px 24px;border:1px solid #274665;border-radius:26px;background:rgba(10,23,38,.94);box-shadow:0 24px 80px rgba(0,0,0,.35)}
.icon{width:92px;height:92px;border-radius:24px;margin:0 auto 18px;display:block}
h1{font-size:24px;margin:0 0 10px;letter-spacing:-.04em}.sub{font-size:13px;line-height:1.65;color:#9db0c5}
.btn{display:block;width:100%;box-sizing:border-box;margin-top:18px;padding:14px 18px;border-radius:14px;background:#1f5f9f;border:1px solid #4b86bd;color:#fff;text-decoration:none;font-weight:800;font-size:15px}
.btn.secondary{background:#13263c;border-color:#294765}.small{margin-top:14px;font-size:11px;line-height:1.55;color:#7389a0}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<img class="icon" src="./app-icon.svg?v=20260907-0915" alt="">
<h1>우리집 재무 대시보드</h1>
<div class="sub" id="msg">설치 준비 중입니다.</div>
<button class="btn" id="installBtn" type="button" hidden>앱으로 설치</button>
<a class="btn secondary" href="./index.html?v=20260911-1105">대시보드 열기</a>
<div class="small" id="hint">앱으로 설치하면 삼성인터넷 배지 없이 독립 아이콘으로 표시됩니다.</div>
</div></div>
<script>
let deferredPrompt=null;
const btn=document.getElementById('installBtn');
const msg=document.getElementById('msg');
const hint=document.getElementById('hint');
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js?v=20260911-1105').catch(()=>{});}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  btn.hidden=false;
  msg.innerHTML='아래 <b>앱으로 설치</b>를 누르면 됩니다.';
});
btn.addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  btn.hidden=true;
});
window.addEventListener('appinstalled',()=>{msg.textContent='설치 완료. 홈 화면 아이콘으로 실행하세요.';hint.textContent='';});
if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true){location.replace('./index.html?v=20260911-1105&app=1');}
setTimeout(()=>{
  if(!deferredPrompt){
    msg.innerHTML='이 브라우저에서는 설치 버튼이 안 뜰 수 있습니다.<br><b>Chrome으로 이 페이지를 열면 설치 버튼이 나타납니다.</b>';
  }
},1800);
</script>
</body>
</html>
