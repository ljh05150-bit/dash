<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>우리집 재무 대시보드</title>
<link rel="manifest" href="./manifest.webmanifest?v=20260913-1212">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./app-icon.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d}
#pullZone{position:fixed;top:0;left:0;right:0;height:38px;z-index:99999;touch-action:none;background:transparent}#dashFrame{display:block;width:100%;height:100%;border:0;background:#06101d}
</style>
</head>
<body>
<div id="pullZone" aria-hidden="true"></div>
<iframe id="dashFrame" src="./index.html?appframe=20260913-1212" title="우리집 재무 대시보드"></iframe>
<script>
const frame=document.getElementById('dashFrame');
const pullZone=document.getElementById('pullZone');
let zoneStartY=null;
pullZone.addEventListener('touchstart',e=>{
  zoneStartY=e.touches&&e.touches[0]?e.touches[0].clientY:null;
},{passive:true});
pullZone.addEventListener('touchmove',e=>{
  if(zoneStartY===null)return;
  const y=e.touches&&e.touches[0]?e.touches[0].clientY:null;
  if(typeof y==='number' && y-zoneStartY>70){
    zoneStartY=null;
    frame.src='./index.html?appframe=20260913-1212&refresh='+Date.now();
  }
},{passive:true});
pullZone.addEventListener('touchend',()=>{zoneStartY=null;},{passive:true});
let lastOpen=0;

function bindRecentClicks(){
  try{
    const doc=frame.contentDocument;
    const win=frame.contentWindow;
    if(!doc||!win||doc.__parentRecentClickBound)return;
    doc.__parentRecentClickBound=true;

    const handler=e=>{
      const row=e.target && e.target.closest ? e.target.closest('#txrows .tx-row[data-recent-edit]') : null;
      if(!row)return;
      const id=row.getAttribute('data-recent-edit');
      if(!id)return;
      const now=Date.now();
      if(now-lastOpen<400)return;
      lastOpen=now;
      e.preventDefault();
      e.stopPropagation();
      if(typeof win.openRecentTransaction==='function'){
        win.openRecentTransaction(id);
      }
    };

    doc.addEventListener('pointerup',handler,true);
    doc.addEventListener('click',handler,true);

    const host=doc.getElementById('txrows');
    if(host){
      const observer=new MutationObserver(()=>{});
      observer.observe(host,{childList:true,subtree:true});
    }
  }catch(e){}
}


let pullStartY=null;
let pullReady=false;

function bindPullToRefresh(){
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.__pullRefreshBound)return;
    doc.__pullRefreshBound=true;

    doc.addEventListener('touchstart',e=>{
      const scroller=doc.scrollingElement||doc.documentElement;
      const y=e.touches&&e.touches[0]?e.touches[0].clientY:null;
      if(typeof y==='number' && (scroller?.scrollTop||0)<=0){
        pullStartY=y;
        pullReady=false;
      }else{
        pullStartY=null;
        pullReady=false;
      }
    },{passive:true});

    doc.addEventListener('touchmove',e=>{
      if(pullStartY===null)return;
      const y=e.touches&&e.touches[0]?e.touches[0].clientY:null;
      if(typeof y==='number' && y-pullStartY>=90) pullReady=true;
    },{passive:true});

    doc.addEventListener('touchend',()=>{
      if(pullReady){
        frame.src='./index.html?appframe=20260913-1212&refresh='+Date.now();
      }
      pullStartY=null;
      pullReady=false;
    },{passive:true});
  }catch(e){}
}

frame.addEventListener('load',()=>{
  bindRecentClicks();
  bindPullToRefresh();
  setTimeout(bindRecentClicks,300);
  setTimeout(bindPullToRefresh,300);
  setTimeout(bindRecentClicks,1200);
});

setInterval(bindRecentClicks,1500);
</script>
</body>
</html>
