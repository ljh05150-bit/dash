<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>우리집 재무 대시보드</title>
<link rel="manifest" href="./manifest.webmanifest?v=20260913-1206">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./app-icon.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d}
#dashFrame{display:block;width:100%;height:100%;border:0;background:#06101d}
</style>
</head>
<body>
<iframe id="dashFrame" src="./index.html?appframe=20260913-1206" title="우리집 재무 대시보드"></iframe>
<script>
const frame=document.getElementById('dashFrame');
let lastOpen=0;

function bindRecentClicks(){
  try{
    const doc=frame.contentDocument;
    const win=frame.contentWindow;
    if(!doc||!win||doc.__parentRecentClickBound)return;
    doc.__parentRecentClickBound=true;

    const handler=e=>{
      const row=e.target && e.target.closest ? e.target.closest('#txrows .tx-row[data-recent-edit]') : null;
      if(!row)return;
      const id=row.getAttribute('data-recent-edit');
      if(!id)return;
      const now=Date.now();
      if(now-lastOpen<400)return;
      lastOpen=now;
      e.preventDefault();
      e.stopPropagation();
      if(typeof win.openRecentTransaction==='function'){
        win.openRecentTransaction(id);
      }
    };

    doc.addEventListener('pointerup',handler,true);
    doc.addEventListener('click',handler,true);

    const host=doc.getElementById('txrows');
    if(host){
      const observer=new MutationObserver(()=>{});
      observer.observe(host,{childList:true,subtree:true});
    }
  }catch(e){}
}

frame.addEventListener('load',()=>{
  bindRecentClicks();
  setTimeout(bindRecentClicks,300);
  setTimeout(bindRecentClicks,1200);
});

setInterval(bindRecentClicks,1500);
</script>
</body>
</html>
