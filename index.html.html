<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>가계부 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}
.card{background:#131722;border:1px solid #242a36;border-radius:18px;padding:16px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.k{font-size:11px;color:#8d95a5} .v{font-size:24px;font-weight:750;margin-top:6px}
h1{font-size:22px;margin:6px 0} h2{font-size:14px;margin:0 0 12px}
input,button{width:100%;padding:13px;border-radius:12px;border:1px solid #242a36;background:#0f131c;color:white;margin-top:8px}
button{background:#1a2130}
table{width:100%;border-collapse:collapse} td,th{padding:10px 5px;border-bottom:1px solid #242a36;font-size:11px;text-align:left} .num{text-align:right}
.pos{color:#37d67a} .neg{color:#ff6b6b} .muted{color:#8d95a5;font-size:11px}
#dash{display:none} .chart{height:260px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div id="auth" class="card">
  <h1>가계부 로그인</h1>
  <div class="muted">금융 데이터는 로그인 후에만 보입니다.</div>
  <input id="email" type="email" placeholder="이메일">
  <input id="pw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>
  <button onclick="signup()">계정 만들기</button>
  <div id="msg" class="muted" style="margin-top:8px"></div>
</div>

<div id="dash">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><h1>가계부 대시보드</h1><div class="muted" id="updated">-</div></div>
    <button style="width:auto" onclick="logout()">로그아웃</button>
  </div>
  <div class="grid">
    <div class="card"><div class="k">순자산</div><div class="v" id="nw">0원</div></div>
    <div class="card"><div class="k">이번달 순CF</div><div class="v" id="cf">0원</div></div>
    <div class="card"><div class="k">금융자산</div><div class="v" id="fa">0원</div></div>
    <div class="card"><div class="k">총부채</div><div class="v" id="debt">0원</div></div>
  </div>
  <div class="card"><h2>최근 6개월 현금흐름</h2><div class="chart"><canvas id="cfchart"></canvas></div></div>
  <div class="card"><h2>최근 거래</h2><table><thead><tr><th>일시</th><th>계좌/카드</th><th>거래처</th><th>분류</th><th class="num">금액</th></tr></thead><tbody id="txrows"></tbody></table></div>
  <div class="card"><h2>주식</h2><table><thead><tr><th>종목</th><th class="num">수량</th><th class="num">평가액</th><th class="num">수익률</th></tr></thead><tbody id="stockrows"></tbody></table></div>
  <div class="card"><h2>부동산</h2><div id="props"></div></div>
</div>
</div>
<script>
const sb = supabase.createClient("https://ixuxaqerdftadfnkxxui.supabase.co","sb_publishable_2Q42l50u-YjgBmu5xDvoAA_LUtLhm8j");
let chart;
function won(n){n=Number(n||0);const a=Math.abs(n),s=n<0?"-":"";if(a>=100000000)return s+(a/100000000).toFixed(a%100000000?2:0)+"억";if(a>=10000)return s+Math.round(a/10000).toLocaleString()+"만";return s+a.toLocaleString()+"원";}
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
async function signup(){const r=await sb.auth.signUp({email:email.value,password:pw.value});msg.textContent=r.error?r.error.message:"계정 생성 완료. 이메일 인증이 필요하면 메일을 확인하세요.";}
async function login(){const r=await sb.auth.signInWithPassword({email:email.value,password:pw.value});msg.textContent=r.error?r.error.message:"";}
async function logout(){await sb.auth.signOut()}
sb.auth.onAuthStateChange((_e,s)=>show(!!s));
sb.auth.getSession().then(r=>show(!!r.data.session));
function show(on){auth.style.display=on?"none":"block";dash.style.display=on?"block":"none";if(on)load();}
async function q(table,order){let x=sb.from(table).select("*");if(order)x=x.order(order,{ascending:false});const r=await x;if(r.error)throw r.error;return r.data||[];}
async function load(){
 try{
  const [tx,a,s,p]=await Promise.all([q("transactions","occurred_at"),q("assets","updated_at"),q("securities","updated_at"),q("properties","updated_at")]);
  const av=a.reduce((z,x)=>z+Number(x.value||0),0), ad=a.reduce((z,x)=>z+Number(x.debt||0),0);
  const sv=s.reduce((z,x)=>z+Number(x.market_value||0),0), pv=p.reduce((z,x)=>z+Number(x.value||0),0), pd=p.reduce((z,x)=>z+Number(x.debt||0),0);
  nw.textContent=won(av+sv+pv-ad-pd);fa.textContent=won(av+sv);debt.textContent=won(ad+pd);
  const thism=ym(new Date());let income=0,expense=0;
  tx.forEach(t=>{if(ym(new Date(t.occurred_at))===thism){Number(t.amount)>=0?income+=Number(t.amount):expense+=Math.abs(Number(t.amount))}});
  cf.textContent=won(income-expense);
  txrows.innerHTML=tx.slice(0,12).map(t=>`<tr><td>${new Date(t.occurred_at).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${t.account||t.source||""}</td><td>${t.merchant||""}</td><td>${t.category||"미분류"}</td><td class="num ${Number(t.amount)>=0?"pos":"neg"}">${Number(t.amount).toLocaleString()}</td></tr>`).join("");
  stockrows.innerHTML=s.map(x=>`<tr><td>${x.ticker}</td><td class="num">${Number(x.quantity||0).toLocaleString()}</td><td class="num">${won(x.market_value)}</td><td class="num">${x.pnl_pct==null?"-":Number(x.pnl_pct).toFixed(1)+"%"}</td></tr>`).join("");
  props.innerHTML=p.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #242a36"><b>${x.name}</b><br><span class="muted">자산 ${won(x.value)} · 대출 ${won(x.debt)} · 월CF ${won(Number(x.monthly_revenue)-Number(x.monthly_interest))}</span></div>`).join("");
  draw(tx);updated.textContent="업데이트 "+new Date().toLocaleString("ko-KR");
 }catch(e){updated.textContent="데이터 오류: "+e.message;console.error(e)}
}
function draw(tx){
 const months=[],now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:ym(d),l:(d.getMonth()+1)+"월"})}
 const m=Object.fromEntries(months.map(x=>[x.k,{i:0,e:0}]));tx.forEach(t=>{const k=ym(new Date(t.occurred_at));if(!m[k])return;const a=Number(t.amount);a>=0?m[k].i+=a:m[k].e+=Math.abs(a)});
 if(chart)chart.destroy();chart=new Chart(document.getElementById("cfchart"),{type:"line",data:{labels:months.map(x=>x.l),datasets:[{label:"수입",data:months.map(x=>m[x.k].i),tension:.35},{label:"지출",data:months.map(x=>m[x.k].e),tension:.35}]},options:{responsive:true,maintainAspectRatio:false}});
}
setInterval(()=>{if(dash.style.display!=="none")load()},60000);
</script>
</body>
</html>
