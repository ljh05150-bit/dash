name: One-shot rent detail install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Zaritalk room detail UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="./finance-core.js?v=20260911-1100"></script>'
          include='<script src="./rent-detail.js?v=20260914-1417"></script>'
          if include not in s:
              if marker not in s:
                  raise SystemExit('finance-core script marker not found')
              s=s.replace(marker, marker+'\n'+include, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "dashboard-fix-bot"
          git config user.email "dashboard-fix-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable room-level Zaritalk rent details"
          git push
