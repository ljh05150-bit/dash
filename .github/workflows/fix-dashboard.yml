name: One-shot rent detail refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh Zaritalk room detail script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="./rent-detail.js?v=20260914-1417"></script>'
          new='<script src="./rent-detail.js?v=20260914-1432"></script>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              marker='<script src="./finance-core.js?v=20260911-1100"></script>'
              if marker not in s:
                  raise SystemExit('finance-core script marker not found')
              s=s.replace(marker,marker+'\n'+new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "dashboard-fix-bot"
          git config user.email "dashboard-fix-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh rent detail sorting UI"
          git push
