name: Exclude Rental Deposit From Cashflow

on:
  push:
    paths:
      - '.github/workflows/exclude-rental-deposit-from-cashflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude rental deposits from income and net cashflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('finance-core.js')
          s = p.read_text(encoding='utf-8')
          old = "if(n>0&&category==='월세수입')return;"
          new = "if(n>0&&(category==='월세수입'||category==='수입/보증금'||category==='보증금'||category==='임대보증금'))return;"
          if old not in s:
              raise SystemExit('expected cashflow condition not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add finance-core.js
          git commit -m "Exclude rental deposits from cashflow income"
          git push
